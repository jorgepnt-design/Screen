name: iOS Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest installed stable Xcode
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          candidates = []
          for path in pathlib.Path('/Applications').glob('Xcode*.app'):
              if 'beta' in path.name.lower() or 'rc' in path.name.lower():
                  continue
              result = subprocess.run([str(path/'Contents/Developer/usr/bin/xcodebuild'), '-version'], capture_output=True, text=True)
              match = re.search(r'Xcode ([\d.]+)', result.stdout)
              if match:
                  candidates.append((tuple(map(int, match[1].split('.'))), str(path/'Contents/Developer')))
          if not candidates:
              raise SystemExit('No stable Xcode installed')
          subprocess.run(['sudo', 'xcode-select', '-s', max(candidates)[1]], check=True)
          PY
          xcodebuild -version
      - name: Build app and Live Activity extension
        run: |
          set -o pipefail
          xcodebuild -project ScreenOn.xcodeproj -scheme ScreenOn -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-build-log
          path: build.log
